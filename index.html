<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eatch-A-Sketch || The Odin Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="header">
        <div class="heading">
            <h1 class="heading-text">
                Etch-A-Sketch
            </h1>
        </div>
       
        <div class="controlers">
            <button class="resize" id="resize">Resize</button>
            <button class="reset" id="reset">Reset</button>
            <button class="random-color" id="randomColor">Random Color</button>
            <button class="default" id="default">Default</button>
        </div>
    </section>

    <main>
        <section class="grid" id="grid">
            <div class="grid-container" id="grid-container">
            <!-- generated div goes here -->
            </div>
        </section>  
    </main>
    

    <footer class="footer">
        <p class="name">Project by Sherap Tamang</p>
        <p class="top">The Odin Project <span class="year">2025</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
